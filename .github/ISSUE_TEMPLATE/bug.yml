name: 回報問題 / Bug report
description: 碼舍怪怪的？告訴我們發生什麼事。
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公開的。送出前請再看一次，刪掉不想公開的內容（路徑、帳號、專案名稱）。
        從碼舍的「紀錄…」→「回報問題…」開啟時，環境和錯誤已經自動填好。
  - type: textarea
    id: description
    attributes:
      label: 發生什麼事
      description: 你做了什麼、預期會怎樣、實際怎樣。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      placeholder: |
        1. 點齒輪
        2. 選「…」
        3. …
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 碼舍、Windows、Claude Code 版本。
      render: text
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: 錯誤紀錄
      description: 只貼 ERROR 開頭的行，不要貼整份紀錄。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 我已經看過上面的內容，沒有不想公開的資料。
          required: true
